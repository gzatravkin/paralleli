<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>ПАРАЛЛЕЛИ · без возврата</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#05060b;color:#cdd2e0;font:13px/1.45 "Segoe UI",system-ui,sans-serif;
       display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px}
  h1{font-size:12px;margin:0;letter-spacing:.24em;text-transform:uppercase;color:#5c6383;font-weight:600}
  canvas{display:block;border:1px solid #1b1f2c;border-radius:6px;background:#05060b;
         box-shadow:0 0 40px rgba(0,0,0,.8) inset}
  #audit{width:1000px;border:1px solid #222738;border-radius:5px;background:#0a0d15;padding:10px 13px;
         font-size:11.5px;color:#79819e;white-space:pre-wrap;font-family:"Consolas",monospace}
  #audit b{color:#d7dcea}
  #audit .ok{color:#67c98a}
  #audit .bad{color:#e2645f}

</style>

<body>
<h1>Параллели · версия Б · вернуться той же дверью нельзя</h1>
<canvas id="cv" width="1000" height="600"></canvas>
<div id="audit">аудит: считаю…</div>
<div id="keys">
  <span><span class="k">A</span><span class="k">D</span> идти</span>
  <span><span class="k">W</span>/<span class="k">Пробел</span> прыжок</span>
  <span><span class="k">W</span><span class="k">S</span> по лианам</span>
  <span><span class="k">E</span> войти в дверь</span>
  <span><span class="k">R</span> заново</span>
  <span><span class="k">TAB</span> карта миров</span>
</div>

<script>
"use strict";

/* ═══════════════════════════════════════════════════════════════════════════
   ПАРАЛЛЕЛИ · БЕЗ ВОЗВРАТА

   Одна карта — девять её версий. Две оси:
     ТЕМПЕРАТУРА  МОРОЗ(0) ← НОРМА(1) → ЖАРА(2)
     УВЯДАНИЕ     ТЛЕН(0)  ← НОРМА(1) → БУЙСТВО(2)

   Двери существуют не во всех версиях мира. Дверь, которой ты прошёл,
   в мире-назначении отсутствует по построению: у двери есть значение
   СВОЕЙ оси, при котором она существует, а шаг всегда уводит с него.
   ═══════════════════════════════════════════════════════════════════════════ */

const W = 64, H = 26, T = 52;          // карта в клетках, размер тайла
const VIEW_W = 1000, VIEW_H = 600;

/* ── версии мира: три оси по три значения = 27 версий ──────────────────── */
const NW = 27;
const TEMP_NAMES = ['МОРОЗ', 'НОРМА', 'ЖАРА'];
const WILT_NAMES = ['ТЛЕН', 'НОРМА', 'БУЙСТВО'];
const ERA_NAMES  = ['ПРОШЛОЕ', 'НАСТОЯЩЕЕ', 'БУДУЩЕЕ'];
const AXIS_NAMES = ['ТЕМПЕРАТУРА', 'УВЯДАНИЕ', 'ЭПОХА'];
const AXIS_VALS  = [TEMP_NAMES, WILT_NAMES, ERA_NAMES];
const widx = (t, d, e) => (t * 3 + d) * 3 + e;
const wtemp = w => (w / 9) | 0;
const wwilt = w => ((w / 3) | 0) % 3;
const wera  = w => w % 3;
const waxis = (w, a) => a === 0 ? wtemp(w) : a === 1 ? wwilt(w) : wera(w);
const W_ADJ  = ['ЗАМЁРЗШИЕ', 'ТИХИЕ', 'РАСКАЛЁННЫЕ'];
const W_NOUN = ['РУИНЫ', 'ЗАЛЫ', 'ЗАРОСЛИ'];
const W_ERA  = [' ПРОШЛОГО', '', ' БУДУЩЕГО'];
const worldName = w => W_ADJ[wtemp(w)] + ' ' + W_NOUN[wwilt(w)] + W_ERA[wera(w)];
const worldShort = w => TEMP_NAMES[wtemp(w)] + ' · ' + WILT_NAMES[wwilt(w)] + ' · ' + ERA_NAMES[wera(w)];
const START_WORLD = widx(1, 1, 1);

/* ── карта ─────────────────────────────────────────────────────────────── */
const map = [];
for (let y = 0; y < H; y++) map.push(new Array(W).fill('#'));
function box(x0, y0, x1, y1, ch) {
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++)
    if (x >= 0 && x < W && y >= 0 && y < H) map[y][x] = ch;
}

/*  '#' камень   '.' пустота
    'w' вода     — мороз: лёд (мост) · норма: топит · жара: испарилась
    'l' лава     — мороз: застыла камнем · иначе смерть
    'm' мостки   — сгорают в жаре, гниют в тлене
    'x' ледяная глыба — ступень; в жаре тает (провал)
    's' снежный нанос — ступень только в мороз
    'v' лианы    — лестница только в буйстве
    'n' заросли  — платформа только в буйстве
    't' поросль в проёме — стена, исчезает только в тлене
    'a' ветхая кладка    — стена, рассыпается только в тлене
    ── ось ЭПОХИ меняет саму архитектуру ──
    'p' целое перекрытие/стена — есть ТОЛЬКО в прошлом: закрывает проход, но даёт опору
    'f' ветхое перекрытие/стена — есть везде, КРОМЕ будущего: в будущем обрушилось
    'r' обвал, куча обломков   — есть ТОЛЬКО в будущем: по ней можно забраться   */

box(44,  4, 62,  7, '.');   // ВЕРХНИЙ зал (пол — плита y=8)
box(10,  9, 62, 14, '.');   // СРЕДНИЙ зал (пол — плита y=15)
box( 1, 16, 50, 21, '.');   // НИЖНИЙ зал  (пол — плита y=22)

box(48, 15, 50, 15, '.');   // дыры в средней плите (спуск в зал C)
box(56,  8, 58,  8, '.');   // дыры в верхней плите (спуск в средний зал)

box(13, 14, 13, 21, 'v');   // лианы: нижний зал A → средний (запад)
box(44,  7, 44, 14, 'v');   // лианы: верхний зал → средний (восток)

box(31, 11, 32, 12, '#');   // перегородка среднего зала…
box(31, 13, 32, 14, 'a');   // …внизу ветхая кладка (проход в тлене)
box(31,  9, 32, 10, 'f');   // …вверху ветхая — в будущем обвалилась
box(30, 12, 30, 13, 'r');   // обломки у стены (только в будущем) — по ним наверх

box(17, 14, 23, 15, 'w');   // разлив на среднем ярусе (7 клеток)
box(16,  9, 16, 14, '#');   // западный карман отрезан: туда только по лианам

box(25, 15, 27, 15, '.');   // колодец из среднего в нижний зал
box(25, 18, 27, 18, 'x');   // ледяная глыба в колодце — ступень / провал
box(24, 19, 24, 19, '#');   // уступы подъёма к глыбе (y=19: коридор внизу остаётся проходим)
box(28, 19, 28, 19, '#');

box( 9, 20, 11, 20, '#');   // постамент части №1
box(16, 22, 22, 23, 'w');   // затопленный колодец (7 клеток)
box(16, 21, 22, 21, 'p');   // в прошлом колодец был перекрыт настилом
box(30, 22, 36, 22, 'm');   // мостки над лавой
box(30, 23, 36, 23, 'l');   // лавовая канава
box(29, 20, 37, 20, 'p');   // в прошлом над лавой шла целая галерея
box(41, 15, 43, 15, 'f');   // кусок средней плиты — в будущем обрушится

box(46, 21, 46, 21, 's');   // снежная лестница в зале C
box(47, 20, 47, 21, 's');
box(48, 19, 48, 21, 's');
box(49, 17, 50, 17, '#');   // каменный карниз под дырами плиты
box(44, 19, 44, 19, '#');   // ящик
box(45, 18, 47, 18, 'n');   // заросли-помост (альтернатива снегу)

box(39, 14, 41, 14, '#');   // постамент биоядра
box(10, 14, 11, 14, '#');   // постамент хроноядра (западный карман)

box(53, 14, 53, 14, 's');   // ледяная лестница средний → верхний
box(54, 13, 54, 13, 's');
box(55, 12, 55, 12, 's');
box(56, 11, 56, 11, 's');
box(57, 10, 57, 10, 's');
box(58,  9, 58,  9, 's');

box(60,  4, 60,  7, 't');   // поросль запирает нишу с сердцевиной
box(59,  8, 61,  8, 'p');   // мост к нише есть только в прошлом (иначе — провал)

/* ── семантика тайлов ──────────────────────────────────────────────────── */
const EMPTY = 0, SOLID = 1, HAZARD = 2, LADDER = 3;
const TILE_CACHE = [];      // [world][y*W+x] -> тип
function tileTypeRaw(ch, t, d, e) {
  switch (ch) {
    case '#': return SOLID;
    case '.': return EMPTY;
    case 'w': return t === 0 ? SOLID : (t === 1 ? HAZARD : EMPTY);
    case 'l': return t === 0 ? SOLID : HAZARD;
    case 'm': return (t === 2 || d === 0) ? EMPTY : SOLID;
    case 'x': return t === 2 ? EMPTY : SOLID;
    case 's': return t === 0 ? SOLID : EMPTY;
    case 'v': return d === 2 ? LADDER : EMPTY;
    case 'n': return d === 2 ? SOLID : EMPTY;
    case 't': return d === 0 ? EMPTY : SOLID;
    case 'a': return d === 0 ? EMPTY : SOLID;
    case 'p': return e === 0 ? SOLID : EMPTY;
    case 'f': return e === 2 ? EMPTY : SOLID;
    case 'r': return e === 2 ? SOLID : EMPTY;
  }
  return SOLID;
}
for (let w = 0; w < NW; w++) {
  const arr = new Uint8Array(W * H), t = wtemp(w), d = wwilt(w), e = wera(w);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) arr[y * W + x] = tileTypeRaw(map[y][x], t, d, e);
  TILE_CACHE.push(arr);
}
const tt = (w, x, y) => (x < 0 || x >= W || y < 0 || y >= H) ? SOLID : TILE_CACHE[w][y * W + x];
const isSolid = (w, x, y) => tt(w, x, y) === SOLID;
const isHazard = (w, x, y) => tt(w, x, y) === HAZARD;
const isLadder = (w, x, y) => tt(w, x, y) === LADDER;
const passable = (w, x, y) => { const v = tt(w, x, y); return v === EMPTY || v === LADDER; };

/* ── части девайса (суперстабильны: одна точка во всех мирах) ──────────── */
const PART_TERMO = 1, PART_BIO = 2, PART_CHRONO = 4, PART_CORE = 8, ALL_PARTS = 15;
const PARTS = [
  { bit: PART_TERMO,  x: 10, y: 19, name: 'ТЕРМОЯДРО', sub: 'ось температуры', col: '#ffb765' },
  { bit: PART_BIO,    x: 40, y: 13, name: 'БИОЯДРО',   sub: 'ось увядания',    col: '#7de08a' },
  { bit: PART_CHRONO, x: 10, y: 13, name: 'ХРОНОЯДРО', sub: 'ось эпохи',       col: '#8fd0f5' },
  { bit: PART_CORE,   x: 62, y:  7, name: 'СЕРДЦЕВИНА', sub: 'девайс собран',  col: '#c9a8ff' },
];

/* ── двери ─────────────────────────────────────────────────────────────────
   kind:  HOT   температура +1  (существует при temp === at, at ∈ {0,1})
          COLD  температура −1  (существует при temp === at, at ∈ {1,2})
          DECAY увядание   −1  (существует при wilt === at, at ∈ {1,2})
          BLOOM увядание   +1  (существует при wilt === at, at ∈ {0,1})
   other: список значений ВТОРОЙ оси, при которых дверь есть.
   Шаг всегда уводит со значения `at` → в мире-назначении двери нет.       */
const DOOR_KINDS = {
  HOT:    { axis: 0, step: +1, name: 'ДВЕРЬ ЖАРЫ',     need: PART_TERMO,  needName: 'термоядро', col: '#ff7a3c', gl: '#ffb066' },
  COLD:   { axis: 0, step: -1, name: 'ДВЕРЬ ХОЛОДА',   need: PART_TERMO,  needName: 'термоядро', col: '#4fb6f0', gl: '#a5e2ff' },
  DECAY:  { axis: 1, step: -1, name: 'ДВЕРЬ ТЛЕНА',    need: PART_BIO,    needName: 'биоядро',   col: '#9a8f7a', gl: '#d8cdb4' },
  BLOOM:  { axis: 1, step: +1, name: 'ДВЕРЬ БУЙСТВА',  need: PART_BIO,    needName: 'биоядро',   col: '#5ac45f', gl: '#a8f0a0' },
  PAST:   { axis: 2, step: -1, name: 'ДВЕРЬ ПРОШЛОГО', need: PART_CHRONO, needName: 'хроноядро', col: '#c8a15e', gl: '#f0d9a8' },
  FUTURE: { axis: 2, step: +1, name: 'ДВЕРЬ БУДУЩЕГО', need: PART_CHRONO, needName: 'хроноядро', col: '#8a7ff0', gl: '#c3bcff' },
};
const D = (x, y, kind, at) => ({ x, y, kind, at });
const DOORS = [
  /* зал A — старт. Полное покрытие по температуре: выход есть в любой версии */
  D( 1, 21, 'PAST',   1),
  D( 2, 21, 'HOT',    0),
  D( 4, 21, 'COLD',   1),
  D( 6, 21, 'HOT',    1),
  D( 8, 21, 'COLD',   2),
  D(12, 21, 'FUTURE', 1),
  /* дно осушённого колодца (добраться можно только в жаре) */
  D(18, 23, 'DECAY',  1),
  D(21, 23, 'BLOOM',  1),
  /* зал B — между колодцем и лавой */
  D(23, 21, 'COLD',   1),
  D(24, 21, 'PAST',   1),
  D(25, 21, 'HOT',    1),
  D(27, 21, 'HOT',    0),
  D(28, 21, 'COLD',   2),
  /* зал C — узел нижнего яруса */
  D(38, 21, 'HOT',    0),
  D(39, 21, 'COLD',   1),
  D(40, 21, 'HOT',    1),
  D(41, 21, 'COLD',   2),
  D(42, 21, 'DECAY',  1),
  D(43, 21, 'BLOOM',  0),
  D(44, 21, 'PAST',   2),
  D(45, 21, 'FUTURE', 1),
  /* средний ярус, западный карман (только по лианам) */
  D(12, 14, 'HOT',    0),
  D(14, 14, 'COLD',   1),
  D(15, 14, 'COLD',   2),
  /* средний ярус, карман у колодца */
  D(24, 14, 'HOT',    0),
  D(28, 14, 'COLD',   1),
  D(29, 14, 'COLD',   2),
  /* средний ярус, восток */
  D(34, 14, 'HOT',    0),
  D(35, 14, 'COLD',   1),
  D(36, 14, 'HOT',    1),
  D(37, 14, 'COLD',   2),
  D(46, 14, 'DECAY',  1),
  D(47, 14, 'BLOOM',  1),
  D(48, 14, 'FUTURE', 0),
  /* восточный карман под лестницей — иначе оттуда не выбраться */
  D(59, 14, 'HOT',    0),
  D(60, 14, 'COLD',   1),
  D(61, 14, 'COLD',   2),
  /* верхний ярус */
  D(45,  7, 'FUTURE', 0),
  D(46,  7, 'COLD',   1),
  D(48,  7, 'HOT',    0),
  D(50,  7, 'COLD',   2),
  D(52,  7, 'BLOOM',  0),
  D(54,  7, 'DECAY',  2),
];
DOORS.forEach((d, i) => { d.id = i; d.k = DOOR_KINDS[d.kind]; });

/* Дверь существует там, где её ось стоит в положении `at`.
   Шаг всегда уводит с этого положения → назад той же дверью нельзя,
   и при этом дверь есть сразу в 9 версиях из 27 (связность не рушится). */
const doorHere = (d, w) => waxis(w, d.k.axis) === d.at;
function doorDest(d, w) {
  const v = [wtemp(w), wwilt(w), wera(w)];
  v[d.k.axis] = Math.max(0, Math.min(2, v[d.k.axis] + d.k.step));
  return widx(v[0], v[1], v[2]);
}
const doorAt = (x, y) => DOORS.find(d => d.x === x && d.y === y);

/* ═══════════════════════════════════════════════════════════════════════════
   АУДИТ. Перебор по (клетка × версия мира × набор частей).
   Модель движения заведомо скромнее живой физики:
     прыжок вверх    3 клетки  (в игре 3.3)
     снос по воздуху 4 клетки  (в игре 5.7 по прямой)
     каждая клетка подъёма СЪЕДАЕТ клетку сноса — в игре подъём на 3 даёт
     ~3.7 клетки по горизонтали, модель разрешает только 1;
     рост героя      2 клетки  (в игре 1.48) — требуем более высокие проходы
   ═══════════════════════════════════════════════════════════════════════════ */
const JUMP_UP = 3, AIR_H = 4, FALL_H = 3;

function buildSucc(w) {
  const stand = (x, y) => passable(w, x, y) && passable(w, x, y - 1);
  const sup = (x, y) => isSolid(w, x, y + 1) || isLadder(w, x, y) || isLadder(w, x, y + 1);
  const ground = (x, y) => stand(x, y) && sup(x, y);
  const succ = new Array(W * H).fill(null);
  const seen = new Int32Array(W * H * 40); let stamp = 0;
  const qs = new Int32Array(W * H * 40);
  const enc = (x, y, ph, up, h) => ((y * W + x) * 2 + ph) * 20 + up * 5 + h;

  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    if (!ground(x, y)) continue;
    stamp++; let qh = 0, qt = 0;
    const out = new Set();
    const push = (nx, ny, ph, up, h) => {
      if (!stand(nx, ny)) return;
      const e = enc(nx, ny, ph, up, h);
      if (seen[e] === stamp) return;
      seen[e] = stamp; qs[qt++] = e;
    };
    /* по лианам вверх/вниз */
    if (isLadder(w, x, y)) {
      if (isLadder(w, x, y - 1) && stand(x, y - 1)) out.add((y - 1) * W + x);
      if (isLadder(w, x, y + 1) && stand(x, y + 1)) out.add((y + 1) * W + x);
    }
    /* шаг вбок */
    for (const dx of [-1, 1]) {
      const nx = x + dx;
      if (!stand(nx, y)) continue;
      if (sup(nx, y)) out.add(y * W + nx);
      else push(nx, y, 1, 0, FALL_H);           // сошёл с края — падение
    }
    /* прыжок */
    push(x, y, 0, JUMP_UP, AIR_H);
    while (qh < qt) {
      const e = qs[qh++];
      const h = e % 5, up = ((e / 5) | 0) % 4, ph = ((e / 20) | 0) % 2, c = (e / 40) | 0;
      const cx = c % W, cy = (c / W) | 0;
      if (sup(cx, cy) && !(cx === x && cy === y)) { out.add(c); continue; }
      if (ph === 0) {
        if (up > 0) push(cx, cy - 1, 0, up - 1, Math.max(0, h - 1));
        if (h > 0) { push(cx - 1, cy, 0, up, h - 1); push(cx + 1, cy, 0, up, h - 1); }
        push(cx, cy, 1, 0, h);
      } else {
        push(cx, cy + 1, 1, 0, h);
        if (h > 0) { push(cx - 1, cy, 1, 0, h - 1); push(cx + 1, cy, 1, 0, h - 1); }
      }
    }
    out.delete(y * W + x);
    succ[y * W + x] = Array.from(out);
  }
  return succ;
}
const SUCC = [];
for (let w = 0; w < NW; w++) SUCC.push(buildSucc(w));
const isGroundIn = (w, c) => SUCC[w][c] !== null;

const PART_AT = new Uint8Array(W * H);
for (const p of PARTS) PART_AT[p.y * W + p.x] |= p.bit;
const DOOR_AT = new Int32Array(W * H).fill(-1);
for (const d of DOORS) DOOR_AT[d.y * W + d.x] = d.id;

const START_CELL = 21 * W + 4;

function runAudit() {
  const rep = { warn: [] };

  /* — структурные проверки — */
  let badLanding = 0, backdoor = 0, hazardLanding = 0;
  for (const d of DOORS) {
    for (let w = 0; w < NW; w++) {
      if (!doorHere(d, w)) continue;
      const w2 = doorDest(d, w);
      if (w2 === w) rep.warn.push('дверь #' + d.id + ' (' + d.k.name + ') в мире ' + worldShort(w) + ' никуда не ведёт');
      if (doorHere(d, w2)) backdoor++;
      if (!isGroundIn(w, d.y * W + d.x)) continue;      // сюда всё равно не встать

function bake(keepPrev) {

  }

/* ── камера, свет, частицы ─────────────────────────────────────────────── */
const cam = { x: 0, y: 0 };

  const tx = Math.max(0, Math.min(W * T - VIEW_W, G.px - VIEW_W / 2));
  const ty = Math.max(0, Math.min(H * T - VIEW_H - T * 1.2, G.py - PH / 2 - VIEW_H / 2 - 40));

const lightCv = document.createElement('canvas'); lightCv.width = 500; lightCv.height = 300;
const lx = lightCv.getContext('2d');
const snapCv = document.createElement('canvas'); snapCv.width = VIEW_W; snapCv.height = VIEW_H;
const sx_ = snapCv.getContext('2d');

}

}

  if (k === 'snow') { p.vx = -14 + Math.random() * 28; p.vy = 26 + Math.random() * 40; p.s = 1.4 + Math.random() * 2.4; p.c = '#dceeff'; }

  if (k === 'ash') { p.vx = -10 + Math.random() * 20; p.vy = 14 + Math.random() * 26; p.s = 1.1 + Math.random() * 2.0; p.c = '#8d8a84'; }
  if (k === 'spore') { p.vx = -12 + Math.random() * 24; p.vy = -12 + Math.random() * 10; p.s = 1.6 + Math.random() * 2.6; p.c = '#b6e88a'; }
  if (k === 'dust') { p.vx = -6 + Math.random() * 12; p.vy = -4 + Math.random() * 12; p.s = 1.0 + Math.random() * 1.5; p.c = '#8e93a8'; }

      G.wave = { t: 0, dur: 0.78, x: tr.sx, y: tr.sy, col: tr.d.k.gl };
      G.shake = 0.4;
      say(AXIS_NAMES[tr.d.k.axis] + ' → ' + AXIS_VALS[tr.d.k.axis][waxis(G.world, tr.d.k.axis)] +
          '. Этой двери здесь больше нет.', 3.4);
    }
    if (tr.t >= tr.dur) G.trans = null;
  }
  else if (G.dead > 0) {
    G.dead -= dt * 1.5;
    if (G.dead <= 0) { G.dead = 0; G.px = G.safe[0]; G.py = G.safe[1]; G.vx = G.vy = 0; G.flash = 0.5; }
  } else if (!G.win) physics(dt);
  G.near = G.trans ? null : nearDoor();
  camUpdate(dt); stepParticles(dt);
}
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.034, (now - last) / 1000); last = now;
  update(dt); render();
  requestAnimationFrame(loop);
}
cam.x = Math.max(0, Math.min(W * T - VIEW_W, G.px - VIEW_W / 2));
cam.y = Math.max(0, Math.min(H * T - VIEW_H - T * 1.2, G.py - VIEW_H / 2 - 40));
bake(); seedParticles(true);
say('Девайс разбился. Собери четыре части. Двери работают в одну сторону.', 4.5);
requestAnimationFrame(loop);

</script>
